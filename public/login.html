<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger — Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-box">
    <h2>Вход / Регистрация</h2>
    <input id="username" placeholder="Имя пользователя" class="neon-border">
    <input id="password" type="password" placeholder="Пароль" class="neon-border">
    <input id="passwordConfirm" type="password" placeholder="Повторите пароль (для регистрации)" class="neon-border">
    <div class="buttons">
      <button onclick="register()">Регистрация</button>
      <button onclick="login()">Войти</button>
    </div>
    <p id="msg"></p>
  </div>

  <script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const passwordConfirmInput = document.getElementById('passwordConfirm');
    const msg = document.getElementById('msg');

    async function register() {
      const username = usernameInput.value;
      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;

      if (password !== passwordConfirm) {
        msg.textContent = "❌ Пароли не совпадают!";
        return;
      }
      if (username.length < 3) {
          msg.textContent = "❌ Имя пользователя должно быть не менее 3 символов.";
          return;
      }
      if (password.length < 6) {
          msg.textContent = "❌ Пароль должен быть не менее 6 символов.";
          return;
      }

      const res = await fetch("/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password })
      });
      const j = await res.json();
      msg.textContent = j.error ? `❌ ${j.error}` : "✅ Регистрация успешна! Теперь вы можете войти.";
    }

    async function login() {
      const username = usernameInput.value;
      const password = passwordInput.value;

      const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password })
      });
      const j = await res.json();
      if (j.success) {
        // Успешный вход! Перенаправляем на главную страницу
        location.href = "/";
      } else {
        msg.textContent = j.error ? `❌ ${j.error}` : "❌ Ошибка входа. Проверьте данные.";
      }
    }
  </script>
</body>
</html>
