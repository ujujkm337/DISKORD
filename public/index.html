<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" hidden>
    <aside id="sidebar">
      <h2 id="myName">...</h2>
      <ul id="users"></ul>
      <button id="allChatBtn">Общий чат</button>
    </aside>
    <main id="chat">
      <header id="chatHeader">
        Общий чат
        <button id="callBtn" hidden>📞</button>
      </header>
      <div id="messages"></div>
      <div id="inputArea">
        <input id="msgInput" placeholder="Введите сообщение..." class="neon-border" />
        <button id="sendBtn">➤</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
